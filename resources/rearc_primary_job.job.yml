resources:
  jobs:
    rearc_primary_job:
      name: rearc_primary_job
      tasks:
        - task_key: BLS_Ingestion
          disabled: false
          email_notifications: {}
          notebook_task:
            notebook_path: ../src/rearc_primary_job/BLS INGESTION.ipynb
            source: WORKSPACE
          run_if: ALL_SUCCESS
          timeout_seconds: 0
          webhook_notifications: {}
        - task_key: Population_ingestion
          disabled: false
          email_notifications: {}
          notebook_task:
            notebook_path: ../src/rearc_primary_job/POPULATION INGESTION.ipynb
            source: WORKSPACE
          run_if: ALL_SUCCESS
          timeout_seconds: 0
          webhook_notifications: {}
        - task_key: Update_main_pipeline
          depends_on:
            - task_key: Population_ingestion
            - task_key: BLS_Ingestion
          disabled: false
          email_notifications: {}
          pipeline_task:
            pipeline_id: ${resources.pipelines.main_pipeline.id}
          run_if: ALL_SUCCESS
          timeout_seconds: 0
      email_notifications:
        no_alert_for_skipped_runs: false
      max_concurrent_runs: 1
      performance_target: PERFORMANCE_OPTIMIZED
      queue:
        enabled: true
      timeout_seconds: 0
      webhook_notifications: {}
      schedule:
        pause_status: UNPAUSED
        quartz_cron_expression: 38 0 1 * * ?
        timezone_id: America/New_York
